sobre:
  title: Olá, Eu sou o Douglas
  sub_title: Engenharia de Software com Alta Performance
  text: Engenheiro de Software Sênior no PicPay, onde atuo como Tech Lead e PHP Skill Lead, com foco em alta
    performance, escalabilidade e sistemas que lidam com bilhões de registros. Minha trajetória na tecnologia começou
    há mais de uma década, passando por telecom, sistemas de ensino e logística — o que me deu uma visão ampla sobre
    desenvolvimento de software, infraestrutura e automações de ponta a ponta.
    <br><br>
    Implementando melhores práticas de desenvolvimento, curioso, autodidata e com aquela vontade de resolver problemas
    complexos. Apaixonado por PHP, sou criador de conteúdo no
    <a href="https://blog.douglasmedeiros.dev" title="Visitar blog" target="_blank" class="text-reset font-Lato-Bold">meu blog</a>,
    ativo na comunidade PHP, palestrante e consultor técnico para times que buscam mais eficiência e qualidade nas entregas.

